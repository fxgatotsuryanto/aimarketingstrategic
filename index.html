    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Apakah AI ini akan menggantikan karyawan saya?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tidak. AI ini adalah \"karyawan AI\" yang menangani tugas repetitif: balas chat 24/7, input data, kirim reminder. Tim Anda beralih ke tugas bernilai tinggi: closing, strategi, hubungan pelanggan. AI mengurangi beban, bukan menggantikan manusia."
          }
        },
        {
          "@type": "Question",
          "name": "Apakah pelanggan tahu mereka bicara dengan AI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Transparansi adalah prinsip kami. AI memperkenalkan diri sebagai \"Asisten Virtual [Nama Bisnis]\" di pesan pertama. Pelanggan Indonesia sudah terbiasa dengan chatbot bisnis — yang mereka butuhkan adalah jawaban cepat dan akurat, bukan siapa yang menjawab."
          }
        },
        {
          "@type": "Question",
          "name": "Berapa lama setup sampai bisa pakai?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Setup standar: 3 hari kerja. Hari 1: Audit alur kerja & mapping skenario. Hari 2: Setup modul AI & integrasi WA/CRM. Hari 3: Uji coba live dengan tim Anda & handover. Modul custom (integrasi ERP/akuntansi khusus) butuh 5-7 hari."
          }
        },
        {
          "@type": "Question",
          "name": "Bagaimana jika AI salah jawab atau keliru?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sistem punya 3 lapisan keamanan: 1) Knowledge base hanya dari dokumen bisnis Anda (bukan internet umum). 2) Fallback ke human: jika confidence < 80%, chat diteruskan ke tim Anda otomatis. 3) Dashboard monitoring real-time — Anda lihat semua percakapan & bisa intervensi kapan saja."
          }
        },
        {
          "@type": "Question",
          "name": "Apakah data pelanggan saya aman?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ya. Data tidak keluar dari infrastruktur Anda. WA Business API terhubung langsung ke server WhatsApp Meta. Knowledge base disimpan di database terenkripsi (Supabase/PostgreSQL) di region Singapore. Kami tidak menjual, membagikan, atau melatih model AI dengan data bisnis Anda. Kontrak kerahasiaan data (NDA) disertakan di kontrak."
          }
        },
        {
          "@type": "Question",
          "name": "Bagaimana kalau nanti ingin berhenti berlangganan?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tanpa denda, tanpa kontrak mengikat panjang. Berlangganan bulanan — berhenti kapan saja, data & CRM tetap milik Anda. Kami bantu ekspor data & handover ke tim internal Anda. Tidak ada vendor lock-in: sistem dibangun di atas standar terbuka (WA API, Supabase, n8n/Make)."
          }
        }
      ]
    }
    </script>
